spring:
  config:
    import: optional:file:.env.dev[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${MEETING_DB_NAME:pagely_meeting}
    username: ${DB_USERNAME:postgre}
    password: ${DB_PASSWORD:postgre}
    driver-class-name: org.postgresql.Driver

  kafka:
    bootstrap-servers: ${KAFKA_EXTERNAL_HOST:localhost}:${KAFKA_EXTERNAL_PORT:9092}

logging:
  level:
    org.flywaydb: info
    org.springframework.kafka: info
    org.apache.kafka.clients.producer: info
    com.pagely.meetingservice: debug

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

book-service:
  url: ${BOOK_SERVICE_URL:http://localhost:19051}
