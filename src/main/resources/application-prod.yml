spring:
  config:
    import: optional:file:.env.prod[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${MEETING_DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  kafka:
    bootstrap-servers: ${KAFKA_EXTERNAL_HOST}:${KAFKA_EXTERNAL_PORT}

logging:
  level:
    org.flywaydb: info
    org.springframework.kafka: warn
    org.apache.kafka.clients.producer: warn
    com.pagely.meetingservice: info

eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}

book-service:
  url: ${BOOK_SERVICE_URL}
