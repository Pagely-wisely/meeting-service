server:
  port: 19011

spring:
  application:
    name: meetingservice

  config:
    import: optional:classpath:/.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${MEETING_DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jackson:
    serialization:
      write-dates-as-timestamps: false

  kafka:
    bootstrap-servers: ${KAFKA_EXTERNAL_HOST}:${KAFKA_EXTERNAL_PORT}

    producer:
      client-id: meetingservice-producer
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        retries: 3
        linger.ms: 0
        request.timeout.ms: 5000
        delivery.timeout.ms: 20000
        spring.json.add.type.headers: false

    consumer:
      group-id: meetingservice-consumer
      client-id: meetingservice-consumer
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  quartz:
    job-store-type: memory
    scheduler-name: meeting-schedule-quartz
    properties:
      org:
        quartz:
          scheduler:
            instanceName: MeetingScheduleQuartzScheduler
          threadPool:
            threadCount: 5

outbox:
  poll-interval-ms: 5000

logging:
  level:
    org.flywaydb: info
    org.springframework.kafka: info
    org.apache.kafka.clients.producer: info
    com.pagely.meetingservice: debug

eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8000/eureka/}

book-service:
  url: http://localhost:19051

cloud:
  openfeign:
    client:
      config:
        bookservice:
          connect-timeout: 1000
          read-timeout: 2000
