spring:
  config:
    import: optional:classpath:/.env

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${MEETING_DB_NAME:pagely_meeting}
    username: ${DB_USERNAME:postgre}
    password: ${DB_PASSWORD:postgre}
    driver-class-name: org.postgresql.Driver



  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    org.flywaydb: info

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false