name: Branch Naming Check

on:
  push:

jobs:
  check-branch-name:
    if: |
      github.ref_name != 'main' &&
      github.ref_name != 'dev' &&
      github.ref_name != 'init' &&
      github.ref_name != 'release' &&
      github.ref_name != 'prod'

    runs-on: ubuntu-latest

    steps:
      - name: Check branch name format
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          REGEX="^(feat|fix|refactor|docs|chore|test)\/[0-9]+-.+$"

          if [[ ! $BRANCH_NAME =~ $REGEX ]]; then
            echo "❌ ERROR: 브랜치 이름 형식이 틀렸습니다!"
            echo "형식: 타입/이슈번호-설명 (예: feat/12-login)"
            exit 1
          fi

          echo "✅ 브랜치 이름 형식이 올바릅니다: $BRANCH_NAME"
