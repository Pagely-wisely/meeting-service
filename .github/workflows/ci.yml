name: Meeting Service CI

on:
  pull_request:
    branches:
      - dev
      - main

  push:
    branches:
      - "**"

jobs:
  branch-naming-check:
    name: Branch Naming Check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_name != 'main' && github.ref_name != 'dev' && github.ref_name != 'init'

    steps:
      - name: Check branch name format
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          REGEX="^(feat|fix|refactor|docs|chore|test)\/[0-9]+-.+$"

          if [[ ! $BRANCH_NAME =~ $REGEX ]]; then
            echo "❌ ERROR: 브랜치 이름 형식이 틀렸습니다!"
            echo "형식: 타입/이슈번호-설명 (예: feat/12-login)"
            exit 1
          fi

          echo "✅ 브랜치 이름 형식이 올바릅니다: $BRANCH_NAME"

  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    if: github.event_name == 'pull_request' || github.ref_name == 'dev' || github.ref_name == 'main'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ${{ secrets.MEETING_DB_NAME }}
          POSTGRES_USER: ${{ secrets.DB_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ${{ secrets.DB_USERNAME }} -d ${{ secrets.MEETING_DB_NAME }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      MEETING_DB_NAME: ${{ secrets.MEETING_DB_NAME }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Build and test
        run: ./gradlew clean build
