name: Continuous Deployment

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 코드 가져오기
        uses: actions/checkout@v4

      - name: 2. JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 3. Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 4. Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            GPR_USER=${{ secrets.GPR_USER }}
            GPR_KEY=${{ secrets.GPR_KEY }}
          tags: ${{ secrets.DOCKER_USERNAME }}/meeting-service:latest

      - name: 5. SSH를 통해 배포 서버 접속 및 컨테이너 실행
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.APP_EC2_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ~/app/meeting
            cd ~/app/meeting

            cat << EOF > .env
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            MEETING_DB_NAME=${{ secrets.MEETING_DB_NAME }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            KAFKA_EXTERNAL_HOST=${{ secrets.KAFKA_EXTERNAL_HOST }}
            KAFKA_EXTERNAL_PORT=${{ secrets.KAFKA_EXTERNAL_PORT }}
            EUREKA_SERVER_URL=${{ secrets.EUREKA_SERVER_URL }}
            BOOK_SERVICE_URL=${{ secrets.BOOK_SERVICE_URL }}
            EOF

            docker pull ${{ secrets.DOCKER_USERNAME }}/meeting-service:latest

            docker stop meeting || true
            docker rm meeting || true

            docker image prune -f

            docker run -d \
              --name meeting \
              -p 19011:19011 \
              -e SPRING_PROFILES_ACTIVE=prod \
              --env-file .env \
              --add-host=host.docker.internal:host-gateway \
              --restart always \
              ${{ secrets.DOCKER_USERNAME }}/meeting-service:latest
