# Meeting Service CD — Docker 이미지 ECR push
#
# 필수 GitHub Secrets (Repository settings → Secrets):
#   GPR_USER, GPR_KEY              — GitHub Packages (common) 빌드
#   AWS_ROLE_ARN                   — OIDC용 IAM Role (권장)
#   또는 AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY
#
# Variables (Settings → Variables) 또는 Secrets:
#   AWS_REGION                     — 예: ap-northeast-2
#   ECR_REPOSITORY                 — 예: meetingservice (기본값 동일)
#
# EC2 배포 시 추가 Secrets:
#   EC2_HOST                       — EC2 퍼블릭 IP 또는 DNS
#   EC2_SSH_PRIVATE_KEY            — 배포용 SSH private key
#   EC2_USER                       — (선택) 미설정 시 ec2-user
#
# EC2 인스턴스: ECR pull 가능한 IAM Instance Profile + /opt/meetingservice/.env.prod

name: Meeting Service CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_to_ec2:
        description: ECR push 후 EC2에 배포
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'meetingservice' }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    outputs:
      image_uri: ${{ steps.image.outputs.uri }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_KEY: ${{ secrets.GPR_KEY }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}"
          docker build \
            --build-arg GPR_USER="${GPR_USER}" \
            --build-arg GPR_KEY="${GPR_KEY}" \
            -t "${IMAGE_URI}:${IMAGE_TAG}" \
            -t "${IMAGE_URI}:latest" \
            .
          docker push "${IMAGE_URI}:${IMAGE_TAG}"
          docker push "${IMAGE_URI}:latest"
          echo "uri=${IMAGE_URI}" >> "${GITHUB_OUTPUT}"

  deploy-ec2:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_to_ec2 == true

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          AWS_REGION: ${{ env.AWS_REGION }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          envs: ECR_REGISTRY,ECR_REPOSITORY,IMAGE_TAG,AWS_REGION
          script: |
            set -euo pipefail
            IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
            aws ecr get-login-password --region "${AWS_REGION}" \
              | docker login --username AWS --password-stdin "${ECR_REGISTRY}"
            docker pull "${IMAGE}"
            docker stop meetingservice-prod 2>/dev/null || true
            docker rm meetingservice-prod 2>/dev/null || true
            docker run -d \
              --name meetingservice-prod \
              --restart unless-stopped \
              -p 19011:19011 \
              --env-file /opt/meetingservice/.env.prod \
              "${IMAGE}"
            sleep 15
            curl -fsS http://localhost:19011/actuator/health
