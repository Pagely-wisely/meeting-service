# 로컬 prod 앱 전용 — 인프라는 docker-compose.dev.yml 로 먼저 기동
# 1) docker compose -f docker-compose.dev.yml --env-file .env.dev up -d postgres kafka book-service
# 2) docker compose -f docker-compose.prod-local.yml --env-file .env.prod.local up -d --build
services:
  meetingservice:
    image: meetingservice:prod-local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GPR_USER: ${GPR_USER}
        GPR_KEY: ${GPR_KEY}
    container_name: meetingservice-prod
    ports:
      - "19011:19011"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_HOST: postgres
      DB_PORT: "5432"
      MEETING_DB_NAME: ${MEETING_DB_NAME:-meetingservice}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_EXTERNAL_HOST: kafka
      KAFKA_EXTERNAL_PORT: "9092"
      BOOK_SERVICE_URL: http://book-service:8080
      EUREKA_CLIENT_ENABLED: ${EUREKA_CLIENT_ENABLED:-false}
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: ${EUREKA_CLIENT_REGISTER_WITH_EUREKA:-false}
      EUREKA_CLIENT_FETCH_REGISTRY: ${EUREKA_CLIENT_FETCH_REGISTRY:-false}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-}
      MANAGEMENT_HEALTH_REDIS_ENABLED: ${MANAGEMENT_HEALTH_REDIS_ENABLED:-false}
      SPRING_CLOUD_DISCOVERY_CLIENT_HEALTH_INDICATOR_ENABLED: ${SPRING_CLOUD_DISCOVERY_CLIENT_HEALTH_INDICATOR_ENABLED:-false}
    networks:
      - meetingservice_default

networks:
  meetingservice_default:
    external: true
