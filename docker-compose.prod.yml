services:
  # ---------------------------------------------------------------------------
  # Temporary Eureka Server
  # 실제 eureka-server 레포가 준비되면 이 서비스는 제거하고 별도 레포 compose로 분리한다.
  # ---------------------------------------------------------------------------
  eureka-server:
    image: springcloud/eureka:2.2.7.RELEASE
    container_name: eureka-server
    ports:
      - "8000:8000"
    environment:
      JAVA_OPTS: "-Dserver.port=8000"
    networks:
      - pagely-network

  # ---------------------------------------------------------------------------
  # Temporary Gateway
  # 실제 gateway-server 레포가 준비되기 전까지 meeting-service 호출 테스트용으로 사용한다.
  # ---------------------------------------------------------------------------
  gateway-server:
    image: nginx:latest
    container_name: gateway-server
    ports:
      - "8080:8080"
    command: >
      /bin/sh -c "cat > /etc/nginx/conf.d/default.conf <<'EOF'
      server {
          listen 8080;

          location /api/v1/meetings {
              proxy_pass http://meetingservice:19011;
              proxy_set_header Host \$host;
              proxy_set_header X-Real-IP \$remote_addr;
              proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto \$scheme;
          }

          location /actuator/health {
              proxy_pass http://meetingservice:19011/actuator/health;
              proxy_set_header Host \$host;
              proxy_set_header X-Real-IP \$remote_addr;
              proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto \$scheme;
          }
      }
      EOF
      nginx -g 'daemon off;'"
    depends_on:
      - meetingservice
    networks:
      - pagely-network

  # ---------------------------------------------------------------------------
  # meeting-service
  # ---------------------------------------------------------------------------
  meetingservice:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GPR_USER: ${GPR_USER}
        GPR_KEY: ${GPR_KEY}
    container_name: meetingservice
    ports:
      - "19011:19011"
    env_file:
      - .env.prod
    depends_on:
      - eureka-server
    networks:
      - pagely-network

  # ---------------------------------------------------------------------------
  # Prometheus
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - meetingservice
    networks:
      - pagely-network

  # ---------------------------------------------------------------------------
  # Grafana
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - pagely-network

  # ---------------------------------------------------------------------------
  # Zipkin
  # ---------------------------------------------------------------------------
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - pagely-network

networks:
  pagely-network:
    external: true
