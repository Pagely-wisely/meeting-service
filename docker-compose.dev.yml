services:
  # ---------------------------------------------------------------------------
  # meeting-service
  # ---------------------------------------------------------------------------
  meetingservice:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GPR_USER: ${GPR_USER}
        GPR_KEY: ${GPR_KEY}
    container_name: pagely-meetingservice
    ports:
      - "19011:19011"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      MEETING_DB_NAME: meetingservice
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_EXTERNAL_HOST: ${KAFKA_EXTERNAL_HOST}
      KAFKA_EXTERNAL_PORT: ${KAFKA_EXTERNAL_PORT}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL}
      BOOK_SERVICE_URL: ${BOOK_SERVICE_URL}
      EUREKA_CLIENT_ENABLED: "false"
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      book-service:
        condition: service_healthy
  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: pagely-meeting
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: meetingservice
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgre -d meetingservice"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  # ---------------------------------------------------------------------------
  # Kafka
  # ---------------------------------------------------------------------------
  kafka:
    image: bitnamilegacy/kafka:3.3.2
    container_name: pagely-kafka
    ports:
      - "9092:9092"
    environment:
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_KRAFT_CLUSTER_ID: "abcdefghijklmnopqrstuv"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
    healthcheck: 
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s
  # ---------------------------------------------------------------------------
  # Prometheus
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: pagely-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      # Docker 컨테이너에서 로컬 PC의 meeting-service에 접근하기 위한 설정
      - "host.docker.internal:host-gateway"
    depends_on:
      meetingservice:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Grafana
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: pagely-grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started
  # ---------------------------------------------------------------------------
  # Eureka
  #  eureka:
  #  image: springcloud/eureka:2.2.7.RELEASE
  #  container_name: pagely-eureka
  #  ports:
  #    - "8761:8761"
  #  environment:
  #    JAVA_OPTS: "-Dserver.port=8761"
  #  healthcheck:
  #    test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1"]
  #    interval: 10s
  #    timeout: 5s
 #     retries: 10
  #    start_period: 60s
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Zipkin
  # ---------------------------------------------------------------------------

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: pagely-zipkin
    ports:
      - "9411:9411"

  # ---------------------------------------------------------------------------
  # book-service Feign이 호출하는 book-service 대역
  # ---------------------------------------------------------------------------
  book-service:
    image: wiremock/wiremock:latest
    container_name: pagely-book-mock
    ports:
      - "19051:8080"
    command:
      - "--verbose"
volumes:
  pgdata: